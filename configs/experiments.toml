[[experiments]]
name = "tsla_regime_features"
description = "TSLA: add macro context and regime flags (post-2018 history)."
tickers = ["TSLA"]
score_metric = "MAE"
[experiments.overrides.tickers.TSLA]
start_date = "2018-01-01"
window_size = 80
forecast_horizon = 2
[experiments.overrides.tickers.TSLA.features]
engineered = [
  "Daily_Return",
  "Log_Return",
  "SMA_10",
  "SMA_30",
  "EMA_10",
  "Volatility_14",
  "High_Low_Range",
  "True_Range",
  "ATR_14",
  "RSI_7",
  "RSI_14",
  "MACD_12_26_9",
  "MACD_SIGNAL_12_26_9",
  "MACD_HIST_12_26_9",
  "Return_5",
  "Return_10",
  "Return_20",
  "Volume_Z_20",
  "Volume_Z_60",
  "Volatility_28",
  "Vol_Regime_28",
  "QQQ_Return",
  "XLY_Return",
  "VIX_Return",
  "CLF_Return"
]
[experiments.overrides.tickers.TSLA.model]
lstm_units = [192, 96]
dropout = 0.3
learning_rate = 0.0004
epochs = 80
loss = "mse"
[experiments.overrides.tickers.TSLA.backtest]
splits = 2
step = 50
min_train_points = 600

[[experiments]]
name = "tsla_seq2seq"
description = "TSLA: sequence-to-sequence LSTM with attention for short horizon."
tickers = ["TSLA"]
score_metric = "MAE"
[experiments.overrides.tickers.TSLA]
